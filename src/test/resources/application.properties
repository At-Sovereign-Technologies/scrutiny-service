spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.sql.init.mode=never

# SR-M5: secreto JWT y rutas de salida de actas para el perfil de test.
scrutiny.security.magistrate-jwt-secret=test-magistrate-secret-0123456789-abcdefghijklmnop
scrutiny.acta.output-dir=target/test-actas
scrutiny.acta.base-url=http://localhost/api/v1/actas

# El servidor gRPC propio esta deshabilitado (este servicio es solo cliente),
# igual que en produccion; evita conflictos de puerto entre contextos de test.
grpc.server.port=-1

# Serializadores Kafka que en produccion vienen de application.properties; se
# replican aqui para que los eventos de dominio (objetos) se serialicen como JSON.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
